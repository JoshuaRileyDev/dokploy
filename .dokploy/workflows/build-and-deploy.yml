name: Build and deploy Dokploy

on:
  push:
    branches:
      - fork
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy the image already published as REGISTRY_IMAGE without rebuilding
        type: boolean
        required: false
        default: false

concurrency:
  group: dokploy-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build ARM64 image and update Swarm
    runs-on: [self-hosted, dokploy-build]
    steps:
      - name: Require the deployment branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/fork" ]]; then
            echo "Production deployments only run from the fork branch." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to private registry
        if: ${{ inputs.deploy_only != true }}
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME" || { echo "REGISTRY_USERNAME is empty; set it as a secret for this workflow repository." >&2; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo "REGISTRY_PASSWORD is empty; set it as a secret for this workflow repository." >&2; exit 1; }
          if [[ ! "$REGISTRY_IMAGE" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?/[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+$ ]]; then
            echo "REGISTRY_IMAGE must be a full registry image reference including a tag." >&2
            exit 1
          fi
          registry_host="${REGISTRY_IMAGE%%/*}"
          docker_config="$(mktemp -d)"
          chmod 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
          REGISTRY_HOST="$registry_host" python3 - <<'PY'
          import base64
          import os
          import sys
          import urllib.error
          import urllib.request

          credentials = f"{os.environ['REGISTRY_USERNAME']}:{os.environ['REGISTRY_PASSWORD']}"
          request = urllib.request.Request(f"https://{os.environ['REGISTRY_HOST']}/v2/")
          request.add_header(
              "Authorization",
              "Basic " + base64.b64encode(credentials.encode()).decode(),
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status == 200:
                      print("Registry accepted the workflow credentials.")
                  else:
                      print(f"Registry credential check returned HTTP {response.status}.")
                      sys.exit(1)
          except urllib.error.HTTPError as error:
              print(f"Registry rejected the workflow credentials with HTTP {error.code}.")
              sys.exit(1)
          except Exception as error:
              print(f"Could not check registry credentials: {type(error).__name__}.")
              sys.exit(1)
          PY
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$registry_host" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push ARM64 image
        if: ${{ inputs.deploy_only != true }}
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
        run: bash apps/dokploy/docker/build-and-push.sh

      - name: Remove temporary registry credentials
        if: always()
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            registry_host="${REGISTRY_IMAGE%%/*}"
            docker logout "$registry_host" >/dev/null 2>&1 || true
            rm -rf "$DOCKER_CONFIG"
          fi

      - name: Update production Swarm service
        env:
          DEPLOY_HOST: 37.27.252.79
          DEPLOY_USER: root
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          REGISTRY_PULL_USERNAME: ${{ secrets.REGISTRY_PULL_USERNAME }}
          REGISTRY_PULL_PASSWORD: ${{ secrets.REGISTRY_PULL_PASSWORD }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          public_key_file="${key_file}.pub"
          trap 'rm -f "$key_file" "$known_hosts_file" "$public_key_file"' EXIT
          python3 - "$key_file" <<'PY'
          import os
          import sys

          key = os.environ["DEPLOY_SSH_PRIVATE_KEY"]
          if "\n" not in key and "\\n" in key:
              key = key.replace("\\r\\n", "\n").replace("\\n", "\n")
          key = key.replace("\r\n", "\n").replace("\r", "\n")
          with open(sys.argv[1], "w") as private_key:
              private_key.write(key.rstrip("\n") + "\n")
          PY
          chmod 600 "$key_file"
          if ! ssh-keygen -y -f "$key_file" > "$public_key_file" 2>/dev/null; then
            echo "DEPLOY_SSH_PRIVATE_KEY is not a usable unencrypted private key. Store the complete private key block with real or escaped newlines and no quotes or passphrase." >&2
            exit 1
          fi
          ssh-keygen -lf "$public_key_file"
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS must contain the verified SSH host-key entry." >&2; exit 1; }
          [[ "$REGISTRY_IMAGE" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?/[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+$ ]] || { echo "REGISTRY_IMAGE must be a full registry image reference including a tag." >&2; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          registry_host="${REGISTRY_IMAGE%%/*}"
          printf -v deploy_command 'trap '\''docker logout %q >/dev/null 2>&1 || true'\'' EXIT; docker login %q --username %q --password-stdin && docker pull %q && docker service update --with-registry-auth --force --image %q --update-parallelism 1 --update-order stop-first --update-monitor 60s --update-failure-action rollback dokploy' "$registry_host" "$registry_host" "$REGISTRY_PULL_USERNAME" "$REGISTRY_IMAGE" "$REGISTRY_IMAGE"
          printf '%s' "$REGISTRY_PULL_PASSWORD" | ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$deploy_command"
