name: Build and deploy Dokploy

on:
  push:
    branches:
      - fork
  workflow_dispatch:

concurrency:
  group: dokploy-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build ARM64 image and update Swarm
    runs-on: ubuntu-latest
    steps:
      - name: Require the deployment branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/fork" ]]; then
            echo "Production deployments only run from the fork branch." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to private registry
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME" || { echo "REGISTRY_USERNAME is empty; set it as a secret for this workflow repository." >&2; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo "REGISTRY_PASSWORD is empty; set it as a secret for this workflow repository." >&2; exit 1; }
          if [[ ! "$REGISTRY_IMAGE" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?/[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+$ ]]; then
            echo "REGISTRY_IMAGE must be a full registry image reference including a tag." >&2
            exit 1
          fi
          registry_host="${REGISTRY_IMAGE%%/*}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$registry_host" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push ARM64 image
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
        run: bash apps/dokploy/docker/build-and-push.sh

      - name: Update production Swarm service
        env:
          DEPLOY_HOST: 37.27.252.79
          DEPLOY_USER: root
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          REGISTRY_PULL_USERNAME: ${{ secrets.REGISTRY_PULL_USERNAME }}
          REGISTRY_PULL_PASSWORD: ${{ secrets.REGISTRY_PULL_PASSWORD }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS must contain the verified SSH host-key entry." >&2; exit 1; }
          [[ "$REGISTRY_IMAGE" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?/[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+$ ]] || { echo "REGISTRY_IMAGE must be a full registry image reference including a tag." >&2; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          registry_host="${REGISTRY_IMAGE%%/*}"
          printf -v deploy_command 'trap '\''docker logout %q >/dev/null 2>&1 || true'\'' EXIT; docker login %q --username %q --password-stdin && docker pull %q && docker service update --with-registry-auth --force --image %q --update-parallelism 1 --update-order stop-first --update-monitor 60s --update-failure-action rollback dokploy' "$registry_host" "$registry_host" "$REGISTRY_PULL_USERNAME" "$REGISTRY_IMAGE" "$REGISTRY_IMAGE"
          printf '%s' "$REGISTRY_PULL_PASSWORD" | ssh \
            -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$deploy_command"
